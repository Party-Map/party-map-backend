spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.terkep.party/realms/party-map
          # Tokens in tests come from spring-security-test; this only keeps the decoder from contacting Keycloak.
          jwk-set-uri: http://localhost:1/jwks
app:
  keycloak:
    admin:
      # Integration tests use FakeKeycloakUsers; the real gateway is built but never called.
      base-url: http://keycloak.test
      client-secret: test-secret
  shell:
    # Integration tests use StaticShellTemplate; the fetcher is built but never called.
    template-url: http://shell.test/index.html
    public-base-url: http://localhost:3000
