spring:
  datasource:
    url: jdbc:postgresql://db:5432/${APP_DB_NAME}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.terkep.party/realms/party-map
springdoc:
  api-docs:
    # Under /api so the reverse proxy routes it with the rest of the API.
    path: /api/openapi
  default-produces-media-type: application/json
server:
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled: true