spring:
  datasource:
    url: jdbc:postgresql://db:5432/${APP_DB_NAME}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASS}
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Loads lazy collections (links, tags, lineups) for a whole result list in a few queries instead of one per row.
        default_batch_fetch_size: 100
  flyway:
    # Production's schema predates Flyway; it matches V1, so an existing schema is baselined at version 1.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.terkep.party/realms/party-map
springdoc:
  api-docs:
    # Under /api so the reverse proxy routes it with the rest of the API.
    path: /api/openapi
  default-produces-media-type: application/json
server:
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled: true
