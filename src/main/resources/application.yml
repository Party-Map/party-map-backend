spring:
  datasource:
    url: jdbc:postgresql://db:5432/${APP_DB_NAME}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASS}
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Loads lazy collections (links, tags, lineups) for a whole result list in a few queries instead of one per row.
        default_batch_fetch_size: 100
  flyway:
    # Production's schema predates Flyway; it matches V1, so an existing schema is baselined at version 1.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.terkep.party/realms/party-map
app:
  keycloak:
    # The confidential client "partymap-backend" whose service account lists users and grants the manager roles.
    admin:
      base-url: ${APP_KEYCLOAK_ADMIN_URL:https://auth.terkep.party}
      realm: party-map
      client-id: partymap-backend
      client-secret: ${APP_KEYCLOAK_ADMIN_CLIENT_SECRET:}
  # The server-rendered shells of /events/{id}, /places/{id} and /performers/{id} (web/shell): the SPA's index.html
  # is fetched from the frontend and enriched with the page's metadata, JSON-LD and data.
  shell:
    template-url: ${APP_SHELL_TEMPLATE_URL:http://frontend:8080/index.html}
    public-base-url: ${APP_SHELL_PUBLIC_BASE_URL:https://terkep.party}
    zone: Europe/Budapest
    template-ttl: 60s
springdoc:
  api-docs:
    # Under /api so the reverse proxy routes it with the rest of the API.
    path: /api/openapi
  # The HTML shells are not part of the API the frontend generates its types from.
  paths-to-match: /api/**
  default-produces-media-type: application/json
server:
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled: true
