# Local development: a throwaway schema that is recreated and seeded on every start (see DevDatabaseConfig).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/partymap
    username: partymap
    password: partymap
  jpa:
    show-sql: true
  flyway:
    # db/seed/afterMigrate.sql is a Flyway callback that inserts the demo data after the migrations.
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false
  security:
    oauth2:
      resourceapp:
  keycloak:
    admin:
      # The dev Keycloak of docker-compose.yml; the secret is the one in keycloak/party-map-realm.json.
      base-url: ${APP_KEYCLOAK_ADMIN_URL:http://localhost:8081}
      client-secret: ${APP_KEYCLOAK_ADMIN_CLIENT_SECRET:partymap-backend-dev-secret}
server:
        jwt:
          issuer-uri: https://auth.terkep.party/realms/party-map
server:
  tomcat:
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      buffered: false
      suffix:
      file-date-format:
