name: Backend

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    # detekt, the tests (Testcontainers uses the runner's Docker) and the JaCoCo 90/80 coverage gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: build/reports

  build-and-push:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the image name
        run: echo "IMAGE_ID=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ID }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_ID }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
