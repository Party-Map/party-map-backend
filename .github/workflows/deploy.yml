name: Backend

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    # detekt, the tests (Testcontainers uses the runner's Docker) and the JaCoCo 90/80 coverage gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: build/reports

  build-and-push:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the image name
        run: echo "IMAGE_ID=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ID }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_ID }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      # The key can only run /root/partymap/bin/deploy on the server (party-map-infra/deploy/README.md); the script
      # pulls the image tagged with this commit, swaps it in, waits for the health check, smoke-tests and rolls back.
      - name: Deploy this commit's image on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'root@204.168.148.191' }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::the DEPLOY_SSH_KEY secret is missing (party-map-infra/deploy/README.md)"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "::error::the DEPLOY_KNOWN_HOSTS variable is missing (party-map-infra/deploy/README.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_TARGET" "backend ${{ github.sha }}"
