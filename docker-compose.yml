services:
  db:
    image: postgres:17-alpine
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${APP_DB_PASS}
      POSTGRES_USER: ${APP_DB_USER}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}" ]
      start_period: 5s
    ports:
      - "5432:5432"
#    networks:
#      - party-map-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${APP_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASS}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/party-map
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
#    networks:
#      - party-map-net

volumes:
  db:

